# Make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep
# ディープスリープ無効(2026-07-10 たけろう判断): 起床後のBLE再接続待ち(数十秒)が
# 使い勝手を損なうため、tibiboard30と同じく常時起きたままにする。
# kscanのwakeup-sourceは無害なので残してある(将来スリープを戻すときのため)。
CONFIG_ZMK_SLEEP=n

# ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n



