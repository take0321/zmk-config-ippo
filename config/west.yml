manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # mainブランチは開発中の先端で今後もコミットが積まれ続けるため、ブランチ名の
      # ままだと次のビルドで別のコード(Bluetooth周りの未検証な変更を含むかもしれない)
      # に勝手に切り替わってしまう。今動いている実機のビルドが使ったコミットに
      # 固定し、意図しない変化を防ぐ(2026-07-09、BLE切断増加の報告を受けて)。
      revision: 904c9aec8822d79149d42c8a9a77e8828eb08f5a
      import: app/west.yml
  self:
    path: config
